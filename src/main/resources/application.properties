spring.application.name=financas-simples-api

# Carrega automaticamente as variáveis do arquivo .env na raiz do projeto
spring.config.import=optional:file:.env[.properties]

# Porta HTTP da API (definida via SERVER_PORT no .env; padrão 8080)
server.port=${SERVER_PORT:8080}

# Conexão com o banco de dados SQL (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:defaultdb}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Configurações da aplicação
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.seed-on-empty=${APP_SEED_ON_EMPTY:false}
